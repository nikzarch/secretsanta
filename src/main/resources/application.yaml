spring:
  application:
    name: secretsanta
  datasource:
    url: ${DATASOURCE_URL_POSTGRES}
    username: ${DATASOURCE_USER_POSTGRES}
    password: ${DATASOURCE_PASSWORD_POSTGRES}
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml


app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: nikzarch-secret-santa-backend
    ttl-minutes: 30